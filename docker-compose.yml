services:

  # ─── HashiCorp Vault (Production mode) ──────────────────────────
  vault:
    image: hashicorp/vault:1.17
    container_name: vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_API_ADDR: https://vault:8200
      VAULT_CLUSTER_ADDR: https://vault:8201
    volumes:
      - ./vault/config/vault.hcl:/vault/config/vault.hcl:ro
      - ./vault/tls:/vault/tls:ro
      - vault-data:/vault/data
      - vault-logs:/vault/logs
    cap_add:
      - IPC_LOCK
    command: server -config=/vault/config/vault.hcl
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── Approval Server (FastAPI) ───────────────────────────────────
  approval-server:
    build:
      context: ./approval-server
      dockerfile: Dockerfile
    container_name: approval-server
    restart: unless-stopped
    ports:
      - "8300:8300"
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_SKIP_VERIFY: "true"          # ปิดเมื่อใช้ cert จริง
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SECRET_TOKEN: ${SECRET_TOKEN:-changeme}
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8300/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  vault-data:
    driver: local
  vault-logs:
    driver: local

networks:
  default:
    name: pipeline-cicd-network
