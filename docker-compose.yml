services:

  # ─── HashiCorp Vault (Production mode) ──────────────────────────
  vault:
    image: hashicorp/vault:1.17
    container_name: vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_LOCAL_CONFIG: >-
        {
          "ui": true,
          "disable_mlock": true,
          "storage": {"file": {"path": "/vault/data"}},
          "listener": [{"tcp": {"address": "0.0.0.0:8200", "tls_disable": "1"}}]
        }
    volumes:
      - ./vault/data:/vault/data
    user: root
    cap_add:
      - IPC_LOCK
    command: server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── Approval Server (FastAPI) ───────────────────────────────────
  approval-server:
    build:
      context: ./approval-server
      dockerfile: Dockerfile
    container_name: approval-server
    restart: unless-stopped
    ports:
      - "8300:8300"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SECRET_TOKEN: ${SECRET_TOKEN:-changeme}
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8300/health"]
      interval: 15s
      timeout: 5s
      retries: 3


networks:
  default:
    name: pipeline-cicd-network
